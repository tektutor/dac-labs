name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab5

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: lab5/requirements.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen graphviz libenchant-2-2 hunspell-en-us \
            g++ default-jdk-headless

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run all checks
        run: make check

      - name: Link check
        if: matrix.python == '3.13'
        continue-on-error: true
        run: make linkcheck

  pdf:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lab5/requirements.txt
          
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen graphviz plantuml default-jre-headless latexmk \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended tex-gyre

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build PDF
        run: make pdf

      - uses: actions/upload-artifact@v7
        with:
          name: battery-monitor-pdf
          path: docs/_build/latex/battery-monitor.pdf
